global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node_exporter'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['node_exporter:9100']
    
  - job_name: 'fastapi_app'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['backend:8000'] 

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml