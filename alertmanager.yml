global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: ${GF_SMTP_FROM_ADDRESS}
  smtp_auth_username: ${GF_SMTP_USER}
  smtp_auth_password: ${SMTP_AUTH_PASSWORD}
  smtp_require_tls: true

route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-alerts"

receivers:
  - name: "email-alerts"
    email_configs:
      - to: ${GF_SMTP_USER}
        send_resolved: true
